<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Snake Game</title>

  <style>
    body {
      margin: 0;
      background: #202124;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: Arial, sans-serif;
      color: white;
      flex-direction: column;
    }

    h1 {
      margin-bottom: 10px;
    }

    canvas {
      background: #3c4043;
      border: 4px solid #5f6368;
      border-radius: 8px;
    }

    .score {
      margin-top: 10px;
      font-size: 20px;
    }

    .controls {
      margin-top: 8px;
      color: #bbb;
    }
  </style>
</head>
<body>

  <h1>Snake</h1>

  <canvas id="game" width="400" height="400"></canvas>

  <div class="score">Score: <span id="score">0</span></div>
  <div class="controls">Use Arrow Keys to Move</div>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");

    const gridSize = 20;
    const tileCount = canvas.width / gridSize;

    let snake = [
      { x: 10, y: 10 }
    ];

    let velocityX = 0;
    let velocityY = 0;

    let food = {
      x: 5,
      y: 5
    };

    let score = 0;

    function gameLoop() {
      update();
      draw();
    }

    function update() {
      const head = {
        x: snake[0].x + velocityX,
        y: snake[0].y + velocityY
      };

      // Wrap around walls
      if (head.x < 0) head.x = tileCount - 1;
      if (head.x >= tileCount) head.x = 0;
      if (head.y < 0) head.y = tileCount - 1;
      if (head.y >= tileCount) head.y = 0;

      // Game starts moving only after key press
      if (velocityX !== 0 || velocityY !== 0) {
        snake.unshift(head);

        // Eat food
        if (head.x === food.x && head.y === food.y) {
          score++;
          document.getElementById("score").textContent = score;
          spawnFood();
        } else {
          snake.pop();
        }

        // Self collision
        for (let i = 1; i < snake.length; i++) {
          if (snake[i].x === head.x && snake[i].y === head.y) {
            resetGame();
          }
        }
      }
    }

    function draw() {
      // Background
      ctx.fillStyle = "#3c4043";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Draw snake
      ctx.fillStyle = "#34a853";
      snake.forEach((segment, index) => {
        ctx.fillRect(
          segment.x * gridSize,
          segment.y * gridSize,
          gridSize - 2,
          gridSize - 2
        );

        // Snake head eyes
        if (index === 0) {
          ctx.fillStyle = "white";
          ctx.fillRect(segment.x * gridSize + 5, segment.y * gridSize + 5, 3, 3);
          ctx.fillRect(segment.x * gridSize + 12, segment.y * gridSize + 5, 3, 3);
          ctx.fillStyle = "#34a853";
        }
      });

      // Draw food
      ctx.fillStyle = "#ea4335";
      ctx.beginPath();
      ctx.arc(
        food.x * gridSize + gridSize / 2,
        food.y * gridSize + gridSize / 2,
        gridSize / 2.5,
        0,
        Math.PI * 2
      );
      ctx.fill();
    }

    function spawnFood() {
      food.x = Math.floor(Math.random() * tileCount);
      food.y = Math.floor(Math.random() * tileCount);
    }

    function resetGame() {
      alert("Game Over! Score: " + score);

      snake = [{ x: 10, y: 10 }];
      velocityX = 0;
      velocityY = 0;
      score = 0;

      document.getElementById("score").textContent = score;

      spawnFood();
    }

    document.addEventListener("keydown", (e) => {
      switch (e.key) {
        case "ArrowUp":
          if (velocityY !== 1) {
            velocityX = 0;
            velocityY = -1;
          }
          break;

        case "ArrowDown":
          if (velocityY !== -1) {
            velocityX = 0;
            velocityY = 1;
          }
          break;

        case "ArrowLeft":
          if (velocityX !== 1) {
            velocityX = -1;
            velocityY = 0;
          }
          break;

        case "ArrowRight":
          if (velocityX !== -1) {
            velocityX = 1;
            velocityY = 0;
          }
          break;
      }
    });

    setInterval(gameLoop, 120);
  </script>

</body>
</html>
