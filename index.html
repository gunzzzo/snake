<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Snake Game</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background:
        radial-gradient(circle at top, #2b2f36, #111418);
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    .game-container {
      text-align: center;
    }

    h1 {
      color: #fff;
      margin-bottom: 12px;
      font-size: 42px;
      letter-spacing: 2px;
      text-shadow: 0 0 15px rgba(52, 168, 83, 0.5);
    }

    canvas {
      background: #1e1e1e;
      border: 5px solid #34a853;
      border-radius: 12px;
      box-shadow:
        0 0 25px rgba(52, 168, 83, 0.35),
        inset 0 0 15px rgba(255,255,255,0.04);
    }

    .hud {
      margin-top: 14px;
      display: flex;
      justify-content: space-between;
      color: white;
      font-size: 20px;
      padding: 0 6px;
    }

    .score {
      color: #34a853;
      font-weight: bold;
    }

    .highscore {
      color: #fbbc05;
      font-weight: bold;
    }

    .controls {
      margin-top: 10px;
      color: #aaa;
      font-size: 14px;
    }

    .game-over {
      margin-top: 10px;
      color: #ea4335;
      font-size: 18px;
      height: 24px;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="game-container">
    <h1>SNAKE</h1>

    <canvas id="game" width="420" height="420"></canvas>

    <div class="hud">
      <div>Score: <span class="score" id="score">0</span></div>
      <div>Best: <span class="highscore" id="best">0</span></div>
    </div>

    <div class="controls">
      Use Arrow Keys to Move
    </div>

    <div class="game-over" id="message"></div>
  </div>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");

    const gridSize = 21;
    const tileCount = canvas.width / gridSize;

    let snake = [{ x: 10, y: 10 }];
    let velocityX = 0;
    let velocityY = 0;

    let food = {
      x: 5,
      y: 5
    };

    let score = 0;
    let bestScore = 0;
    let gameRunning = true;

    function gameLoop() {
      if (gameRunning) {
        update();
      }

      draw();
    }

    function update() {
      if (velocityX === 0 && velocityY === 0) return;

      const head = {
        x: snake[0].x + velocityX,
        y: snake[0].y + velocityY
      };

      // WALL COLLISION = GAME OVER
      if (
        head.x < 0 ||
        head.x >= tileCount ||
        head.y < 0 ||
        head.y >= tileCount
      ) {
        endGame();
        return;
      }

      snake.unshift(head);

      // FOOD
      if (head.x === food.x && head.y === food.y) {
        score++;
        document.getElementById("score").textContent = score;

        if (score > bestScore) {
          bestScore = score;
          document.getElementById("best").textContent = bestScore;
        }

        spawnFood();
      } else {
        snake.pop();
      }

      // SELF COLLISION
      for (let i = 1; i < snake.length; i++) {
        if (
          snake[i].x === head.x &&
          snake[i].y === head.y
        ) {
          endGame();
        }
      }
    }

    function draw() {
      // Background
      ctx.fillStyle = "#16181d";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Grid
      for (let i = 0; i < tileCount; i++) {
        for (let j = 0; j < tileCount; j++) {
          ctx.strokeStyle = "rgba(255,255,255,0.03)";
          ctx.strokeRect(
            i * gridSize,
            j * gridSize,
            gridSize,
            gridSize
          );
        }
      }

      // Food glow
      ctx.shadowBlur = 20;
      ctx.shadowColor = "#ea4335";

      // Food
      ctx.fillStyle = "#ea4335";
      ctx.beginPath();
      ctx.arc(
        food.x * gridSize + gridSize / 2,
        food.y * gridSize + gridSize / 2,
        gridSize / 2.8,
        0,
        Math.PI * 2
      );
      ctx.fill();

      ctx.shadowBlur = 0;

      // Snake
      snake.forEach((segment, index) => {

        if (index === 0) {
          // Head
          ctx.fillStyle = "#5cff8d";
        } else {
          // Body gradient
          ctx.fillStyle = `rgb(52, ${140 + index * 2}, 83)`;
        }

        ctx.beginPath();
        ctx.roundRect(
          segment.x * gridSize + 1,
          segment.y * gridSize + 1,
          gridSize - 2,
          gridSize - 2,
          6
        );
        ctx.fill();

        // Eyes
        if (index === 0) {
          ctx.fillStyle = "black";

          ctx.beginPath();
          ctx.arc(
            segment.x * gridSize + 7,
            segment.y * gridSize + 8,
            2,
            0,
            Math.PI * 2
          );
          ctx.fill();

          ctx.beginPath();
          ctx.arc(
            segment.x * gridSize + 14,
            segment.y * gridSize + 8,
            2,
            0,
            Math.PI * 2
          );
          ctx.fill();
        }
      });
    }

    function spawnFood() {
      food.x = Math.floor(Math.random() * tileCount);
      food.y = Math.floor(Math.random() * tileCount);

      // Prevent food spawning inside snake
      for (let segment of snake) {
        if (segment.x === food.x && segment.y === food.y) {
          spawnFood();
        }
      }
    }

    function endGame() {
      gameRunning = false;

      document.getElementById("message").textContent =
        "GAME OVER — Press SPACE to Restart";
    }

    function restartGame() {
      snake = [{ x: 10, y: 10 }];
      velocityX = 0;
      velocityY = 0;
      score = 0;

      document.getElementById("score").textContent = score;
      document.getElementById("message").textContent = "";

      spawnFood();

      gameRunning = true;
    }

    document.addEventListener("keydown", (e) => {

      // Restart
      if (e.code === "Space" && !gameRunning) {
        restartGame();
      }

      // Controls
      switch (e.key) {
        case "ArrowUp":
          if (velocityY !== 1) {
            velocityX = 0;
            velocityY = -1;
          }
          break;

        case "ArrowDown":
          if (velocityY !== -1) {
            velocityX = 0;
            velocityY = 1;
          }
          break;

        case "ArrowLeft":
          if (velocityX !== 1) {
            velocityX = -1;
            velocityY = 0;
          }
          break;

        case "ArrowRight":
          if (velocityX !== -1) {
            velocityX = 1;
            velocityY = 0;
          }
          break;
      }
    });

    spawnFood();

    setInterval(gameLoop, 95);
  </script>

</body>
</html>
